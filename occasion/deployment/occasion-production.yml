name: Produce and deliver occasion posts

# SECURITY: copy this workflow into a PRIVATE orchestration repository. Never
# attach the persistent desktop runner to the public slide-renderers repository.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Planning date in IST (YYYY-MM-DD); Apps Script supplies it"
        required: false
        type: string
  schedule:
    # Backup only. The primary clock is Apps Script. This is 08:53 IST and is
    # intentionally away from the start of the UTC hour.
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: occasion-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: [self-hosted, windows, x64, dock-content-desktop]
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      HIGGSFIELD_MODEL: nano_banana_2
      HIGGSFIELD_RESOLUTION: 2k
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_DATE: ${{ inputs.date }}

    steps:
      - name: Check out the private orchestration repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Check out the public engine repository read-only
        id: checkout_engine
        uses: actions/checkout@v5
        with:
          repository: jain13abhi/slide-renderers
          ref: main
          path: engine
          persist-credentials: false

      - name: Verify the persistent runtime
        id: preflight
        working-directory: engine
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python --version
          higgsfield version
          python -c "from PIL import Image; print('Pillow', Image.__version__)"

      - name: Produce due packages
        id: produce
        working-directory: engine
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $runDate = $env:RUN_DATE
          if (-not $runDate) {
            $ist = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId(
              [DateTime]::UtcNow,
              'India Standard Time'
            )
            $runDate = $ist.ToString('yyyy-MM-dd')
          }
          python -m occasion.engine produce `
            --date $runDate `
            --state-root ../data/occasion/state `
            --output-root ../data/occasion/production `
            --manifest ../data/occasion/production/manifest.json `
            2>&1 | Tee-Object -FilePath ../occasion-error.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit generated package
        id: archive
        if: always() && steps.checkout_engine.outcome == 'success' && steps.produce.outcome != 'skipped'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "dock-content-engine[bot]"
          git config user.email "dock-content-engine@users.noreply.github.com"
          git add data/occasion/production data/occasion/state
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "No new occasion package was due."
          } else {
            git commit -m "occasion: generate due production packages"
            git push origin HEAD:main
          }

      - name: Deliver package to Telegram
        id: deliver
        if: always() && steps.archive.outcome == 'success' && steps.produce.outcome != 'skipped'
        working-directory: engine
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          python -m occasion.engine deliver `
            --state-root ../data/occasion/state `
            2>&1 | Tee-Object -FilePath ../occasion-error.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit delivered state
        if: always() && steps.deliver.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git add data/occasion/state
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output "No delivery-state update was required."
          } else {
            git commit -m "occasion: record Telegram delivery"
            git push origin HEAD:main
          }

      - name: Notify Telegram about any failure
        if: failure()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Test-Path engine/occasion/engine/__main__.py) -and (Test-Path occasion-error.log)) {
            Push-Location engine
            python -m occasion.engine notify-failure `
              --stage "${{ steps.preflight.outcome == 'failure' && 'runner preflight' || (steps.produce.outcome == 'failure' && 'production' || (steps.archive.outcome == 'failure' && 'archive' || 'delivery/state archive')) }}" `
              --detail-file ../occasion-error.log
            Pop-Location
          } elseif (Test-Path engine/occasion/engine/__main__.py) {
            Push-Location engine
            python -m occasion.engine notify-failure `
              --stage "runner preflight" `
              --detail "The desktop workflow failed before an engine log was created."
            Pop-Location
          } else {
            $uri = "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage"
            Invoke-RestMethod -Method Post -Uri $uri -Body @{
              chat_id = $env:TELEGRAM_CHAT_ID
              text = "OCCASION PIPELINE FAILED`nStage: checkout/preflight`nThe engine checkout did not complete on the desktop runner."
            }
          }
